<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --colorDark1: #112D4E;
      --colorDark2: #3F72AF;
      --colorLight1: #DBE2EF;
      --colorLight2: #F9F7F7;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Merriweather Sans', sans-serif;
    }

    body {
      max-width: 100vw;
      min-height: 100vh;
      color: var(--colorLight2);
      background-image: linear-gradient(160deg, #112d4e 0%, #3f72af 100%);
    }

    h1 {
      text-align: center;
      text-transform: uppercase;
      padding-top: 20px;
    }

    .wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 2rem;
    }

    .tab-container {
      display: flex;
      justify-content: space-between;
      max-width: 550px;
      width: 90%;
      margin: 0 auto;
      margin-top: 2rem;
    }

    .tab {
      cursor: pointer;
      font-size: 0.875rem;
      letter-spacing: 1.75px;
      padding: 5px 8px;
    }

    .tab.current-tab {
      background-color: rgba(219, 226, 239, 0.5);
      border-radius: 4px;
    }

    .weather-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin-block: 2rem;
    }

    .btn {
      all: unset;
      font-size: 0.85rem;
      text-transform: uppercase;
      border-radius: 5px;
      background-color: var(--colorDark2);
      cursor: pointer;
      padding: 10px 30px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease-in-out;
    }

    .btn:hover {
      background-color: var(--colorDark1);
    }

    .sub-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 550px;
      margin: 0 auto;
      padding: 2rem;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0px 8px 24px rgba(0, 0, 0, 0.2);
    }

    .grant-location-container {
      display: none;
    }

    .grant-location-container.active {
      display: flex;
    }

    .grant-location-container img {
      margin-bottom: 2rem;
    }

    .grant-location-container p:first-of-type {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .grant-location-container p:last-of-type {
      font-size: 0.85rem;
      font-weight: 300;
      margin-bottom: 1.75rem;
      letter-spacing: 0.75px;
    }

    .loading-container {
      display: none;
    }

    .loading-container.active {
      display: flex;
    }

    .loading-container p {
      text-transform: uppercase;
      font-size: 1.25rem;
      font-weight: 500;
      margin-top: 1rem;
    }

    .user-info-container {
      display: none;
    }

    .user-info-container.active {
      display: flex;
    }

    .name {
      display: flex;
      align-items: center;
      gap: 0 0.5rem;
      margin-bottom: 1rem;
    }

    .name p {
      font-size: 1.5rem;
      font-weight: 500;
    }

    .name img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .user-info-container p[data-temp] {
      font-size: 2.75rem;
      font-weight: 700;
      margin-top: 1rem;
    }

    .user-info-container p[data-weatherDesc] {
      font-size: 1.2rem;
      font-weight: 400;
      text-transform: capitalize;
    }

    .user-info-container img[data-weatherIcon] {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .parameter-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
      align-items: center;
      margin-top: 2rem;
      width: 100%;
    }

    .parameter {
      width: 30%;
      min-width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background-color: rgba(219, 226, 239, 0.3);
      border-radius: 5px;
      padding: 1rem;
    }

    .parameter img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .parameter p:first-of-type {
      font-size: 0.85rem;
      font-weight: 300;
      text-transform: uppercase;
    }

    .parameter p:last-of-type {
      font-size: 1rem;
      font-weight: 600;
    }

    .form-container {
      display: none;
      width: 90%;
      max-width: 550px;
      margin: 0 auto;
      justify-content: center;
      align-items: center;
      gap: 0 10px;
      margin-bottom: 2rem;
    }

    .form-container.active {
      display: flex;
    }

    .form-container input {
      all: unset;
      width: calc(100% - 80px);
      height: 40px;
      padding: 0 20px;
      background-color: rgba(219, 226, 239, 0.5);
      border-radius: 10px;
      color: var(--colorLight2);
    }

    .form-container input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .form-container input:focus {
      outline: 3px solid rgba(255, 255, 255, 0.7);
    }

    .form-container button {
      padding: unset;
      width: 40px;
      height: 40px;
    }

    .error-container {
      display: none;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
      color: rgb(255, 107, 107);
      font-weight: 500;
      font-size: 1rem;
      width: 90%;
      max-width: 550px;
      margin: 0 auto;
    }

    .error-container.active {
      display: flex;
    }

    /* Footer Styles */
    .footer {
      width: 100%;
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--colorLight1);
      margin-top: auto;
    }

    .footer a {
      color: var(--colorLight2);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="wrapper">



    <div
      style="background-color: #333; padding: 10px; display: flex; justify-content: space-around; align-items: center;">
      <a href="#" style="color: white; text-decoration: none; padding: 8px 16px; font-family: sans-serif;">Home</a>
      <a href="#" style="color: white; text-decoration: none; padding: 8px 16px; font-family: sans-serif;">About</a>
      <a href="#" style="color: white; text-decoration: none; padding: 8px 16px; font-family: sans-serif;">Services</a>
      <a href="#" style="color: white; text-decoration: none; padding: 8px 16px; font-family: sans-serif;">Contact</a>
    </div>
    <h1>Weather App</h1>

    <div class="tab-container">
      <p class="tab current-tab" data-userWeather>Your Weather</p>
      <p class="tab" data-searchWeather>Search Weather</p>
    </div>

    <div class="weather-container">
      <!-- Grant Location -->
      <div class="sub-container grant-location-container active">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" width="80" height="80" loading="lazy">
        <p>Grant Location Access</p>
        <p>Allow access to get weather information</p>
        <button class="btn" data-grantAccess>Grant Access</button>
      </div>

      <!-- Search Form -->
      <form class="form-container" data-searchForm>
        <input placeholder="Search for City..." data-searchInput>
        <button class="btn" type="submit">
          <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" width="20" height="20" loading="lazy">
        </button>
      </form>

      <!-- Error Container -->
      <div class="error-container">
        <p>City not found. Please check and try again.</p>
      </div>

      <!-- Loading Screen -->
      <div class="sub-container loading-container">
        <img src="https://media.tenor.com/On7kvXhzml4AAAAj/loading-gif.gif" width="150" height="150">
        <p>Loading</p>
      </div>

      <!-- Weather Info -->
      <div class="sub-container user-info-container">
        <div class="name">
          <p data-cityName></p>
          <img data-countryIcon src="https://flagcdn.com/in.svg" width="30" height="30" alt="Indian Flag">
        </div>

        <p data-weatherDesc></p>
        <img data-weatherIcon>
        <p data-temp></p>

        <div class="parameter-container">
          <div class="parameter">
            <img src="https://cdn-icons-png.flaticon.com/512/481/481152.png">
            <p>Windspeed</p>
            <p data-windspeed></p>
          </div>

          <div class="parameter">
            <img src="https://cdn-icons-png.flaticon.com/512/728/728093.png">
            <p>Humidity</p>
            <p data-humidity></p>
          </div>

          <div class="parameter">
            <img src="https://cdn-icons-png.flaticon.com/512/1163/1163624.png">
            <p>Clouds</p>
            <p data-cloudiness></p>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>Designed with ❤️ | Weather data provided by <a href="https://openweathermap.org/"
          target="_blank">OpenWeatherMap</a></p>
    </div>
  </div>

  <script>
    // API Key from OpenWeatherMap (you would need to replace this with your actual API key)
    const API_KEY = "d1845658f92b31c64bd94f06f7188c9c";

    // Elements
    const userTab = document.querySelector("[data-userWeather]");
    const searchTab = document.querySelector("[data-searchWeather]");
    const grantAccessContainer = document.querySelector(".grant-location-container");
    const searchForm = document.querySelector("[data-searchForm]");
    const loadingContainer = document.querySelector(".loading-container");
    const userInfoContainer = document.querySelector(".user-info-container");
    const errorContainer = document.querySelector(".error-container");

    // Variables for storing current tab
    let currentTab = userTab;
    currentTab.classList.add("current-tab");

    // Check if coordinates are already saved in session storage
    getFromSessionStorage();

    // Tab switching
    function switchTab(clickedTab) {
      if (clickedTab !== currentTab) {
        currentTab.classList.remove("current-tab");
        currentTab = clickedTab;
        currentTab.classList.add("current-tab");

        // If searchForm container is not active, make it active
        if (!searchForm.classList.contains("active")) {
          userInfoContainer.classList.remove("active");
          grantAccessContainer.classList.remove("active");
          searchForm.classList.add("active");
          errorContainer.classList.remove("active");
        } else {
          // If we're switching to user weather tab
          searchForm.classList.remove("active");
          userInfoContainer.classList.remove("active");
          errorContainer.classList.remove("active");

          // Check if we have saved coordinates
          getFromSessionStorage();
        }
      }
    }

    userTab.addEventListener("click", () => {
      switchTab(userTab);
    });

    searchTab.addEventListener("click", () => {
      switchTab(searchTab);
    });

    // Check if coordinates are in session storage
    function getFromSessionStorage() {
      const localCoordinates = sessionStorage.getItem("user-coordinates");

      if (!localCoordinates) {
        // If no coordinates found, show grant access container
        grantAccessContainer.classList.add("active");
      } else {
        // If coordinates found, fetch weather info
        const coordinates = JSON.parse(localCoordinates);
        fetchUserWeatherInfo(coordinates);
      }
    }

    // Fetch weather info using coordinates
    async function fetchUserWeatherInfo(coordinates) {
      const { lat, lon } = coordinates;

      // Remove previous UI displays
      grantAccessContainer.classList.remove("active");
      errorContainer.classList.remove("active");
      loadingContainer.classList.add("active");

      try {
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
        );
        const data = await response.json();

        if (response.ok) {
          loadingContainer.classList.remove("active");
          userInfoContainer.classList.add("active");
          renderWeatherInfo(data);
        } else {
          loadingContainer.classList.remove("active");
          errorContainer.classList.add("active");
        }
      } catch (err) {
        loadingContainer.classList.remove("active");
        errorContainer.classList.add("active");
      }
    }

    // Render weather info on UI
    function renderWeatherInfo(weatherInfo) {
      // First fetch all elements 
      const cityName = document.querySelector("[data-cityName]");
      const countryIcon = document.querySelector("[data-countryIcon]");
      const desc = document.querySelector("[data-weatherDesc]");
      const weatherIcon = document.querySelector("[data-weatherIcon]");
      const temp = document.querySelector("[data-temp]");
      const windspeed = document.querySelector("[data-windspeed]");
      const humidity = document.querySelector("[data-humidity]");
      const cloudiness = document.querySelector("[data-cloudiness]");

      // Populate weather info
      cityName.innerText = weatherInfo?.name || "Unknown Location";

      // Update country flag - we're specifically using India flag 
      countryIcon.src = weatherInfo.sys?.country === "IN"
        ? "https://flagcdn.com/in.svg"
        : `https://flagcdn.com/${weatherInfo.sys?.country.toLowerCase()}.svg`;

      desc.innerText = weatherInfo?.weather?.[0]?.description || "";
      weatherIcon.src = `https://openweathermap.org/img/wn/${weatherInfo?.weather?.[0]?.icon}@2x.png`;
      temp.innerText = `${(weatherInfo?.main?.temp || 0).toFixed(2)}°C`;
      windspeed.innerText = `${(weatherInfo?.wind?.speed || 0).toFixed(2)} m/s`;
      humidity.innerText = `${weatherInfo?.main?.humidity || 0}%`;
      cloudiness.innerText = `${weatherInfo?.clouds?.all || 0}%`;
    }

    // Grant location access button
    const grantAccessButton = document.querySelector("[data-grantAccess]");
    grantAccessButton.addEventListener("click", getLocation);

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition, showError);
      } else {
        alert("Geolocation is not supported by this browser.");
      }
    }

    // Success callback for geolocation
    function showPosition(position) {
      const userCoordinates = {
        lat: position.coords.latitude,
        lon: position.coords.longitude,
      };

      sessionStorage.setItem("user-coordinates", JSON.stringify(userCoordinates));
      fetchUserWeatherInfo(userCoordinates);
    }

    // Error callback for geolocation
    function showError(error) {
      switch (error.code) {
        case error.PERMISSION_DENIED:
          alert("Location permission denied. Please allow location access to use this feature.");
          break;
        case error.POSITION_UNAVAILABLE:
          alert("Location information is unavailable.");
          break;
        case error.TIMEOUT:
          alert("The request to get user location timed out.");
          break;
        case error.UNKNOWN_ERROR:
          alert("An unknown error occurred while getting location.");
          break;
      }
    }

    // Search form
    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      let cityName = document.querySelector("[data-searchInput]").value.trim();

      if (cityName === "") {
        return;
      } else {
        fetchSearchWeatherInfo(cityName);
      }
    });

    // Fetch weather info using city name
    async function fetchSearchWeatherInfo(city) {
      loadingContainer.classList.add("active");
      userInfoContainer.classList.remove("active");
      grantAccessContainer.classList.remove("active");
      errorContainer.classList.remove("active");

      try {
        const response = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
        );
        const data = await response.json();

        if (response.ok) {
          loadingContainer.classList.remove("active");
          userInfoContainer.classList.add("active");
          renderWeatherInfo(data);
        } else {
          loadingContainer.classList.remove("active");
          errorContainer.classList.add("active");
        }
      } catch (err) {
        loadingContainer.classList.remove("active");
        errorContainer.classList.add("active");
      }
    }
  </script>
</body>

</html>
